[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bikecomputer"
version = "0.1.0"
description = "Raspberry Pi Zero 2 W bike computer"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "spidev>=3.6",
    "RPi.GPIO>=0.7",
    "gpxpy>=1.6",
    "mapbox-vector-tile>=2.0",
    "aiohttp>=3.9",
    "dbus-fast>=2.21",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bikecomputer = "bikecomputer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
